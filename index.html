<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Courses - FlipStuck | Find the right course for your next step</title>
  <meta name="description" content="Discover courses to help you learn, grow, and succeed with FlipStuck. Explore top-rated masterclasses in Web Development, UI/UX Design, Data Science, and more.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@1&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Playfair+Display:ital,wght@1,500;1,600&display=swap" rel="stylesheet">
  <link rel="icon" type="image/x-icon" href="Assets-2/favicon.ico">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="top"></div>
  <!-- Pure CSS Mobile Menu Toggle -->
  <input type="checkbox" id="mobile-menu-toggle" class="mobile-menu-toggle-checkbox" aria-hidden="true" hidden>

    <!-- Pure CSS Mobile Filter Toggle -->
  <input type="checkbox" id="mobile-filter-toggle" class="mobile-filter-toggle-checkbox" aria-hidden="true" hidden>

  <header class="site-header" id="siteHeader">
    <div class="header-container">
      <a href="index.html" class="brand-logo" aria-label="FlipStuck Home">
        <img src="Assets-2/logo-flip.svg" alt="FlipStuck" class="logo-img" width="140" height="38">
      </a>
      <nav class="nav-links" aria-label="Main Navigation">
        <a href="../T1/TaskOne/index.html" class="nav-link">Home</a>
        <a href="index.html" class="nav-link active" aria-current="page">Courses</a>
        <a href="#categories" class="nav-link">Categories</a>
        <a href="#contact" class="nav-link">Contact</a>
      </nav>
      <div class="header-right">
        <div class="header-action">
          <a href="#exploreGrid" class="btn btn-primary btn-sm">Explore Courses</a>
        </div>
        <!-- Pure CSS Mobile Hamburger Button -->
        <label for="mobile-menu-toggle" class="mobile-menu-btn" aria-label="Open mobile menu">
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
          <span class="hamburger-bar"></span>
        </label>
      </div>
    </div>
  </header>

  <!-- Pure CSS Mobile Navigation Drawer & Backdrop -->
  <label for="mobile-menu-toggle" class="mobile-nav-backdrop" id="mobileNavBackdrop"></label>
  <aside class="mobile-nav-drawer" id="mobileNavDrawer" aria-label="Mobile Navigation Menu">
    <div class="mobile-nav-header">
      <a href="index.html" class="brand-logo">
        <img src="Assets-2/logo-flip.svg" alt="FlipStuck" class="logo-img" width="130" height="35">
      </a>
      <label for="mobile-menu-toggle" class="mobile-nav-close" aria-label="Close menu">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="18" y1="6" x2="6" y2="18"></line>
          <line x1="6" y1="6" x2="18" y2="18"></line>
        </svg>
      </label>
    </div>
    <div class="mobile-nav-content">
      <ul class="mobile-nav-list">
        <li><a href="../T1/TaskOne/index.html" class="mobile-nav-link">Home</a></li>
        <li><a href="index.html" class="mobile-nav-link active">Courses</a></li>
        <li><a href="#categories" class="mobile-nav-link">Categories</a></li>
        <li><a href="#contact" class="mobile-nav-link">Contact</a></li>
      </ul>
      <div class="mobile-nav-action">
        <a href="#exploreGrid" class="btn btn-primary mobile-cta-btn">Explore Courses</a>
      </div>
    </div>
  </aside>
  <main id="mainContent">
    <!-- ================= BREADCRUMB & HERO SEARCH ================= -->
    <section class="explore-hero-section">
      <div class="explore-hero-container">
        <!-- Breadcrumb -->
        <nav class="breadcrumb-nav" aria-label="Breadcrumbs">
          <a href="../T1/TaskOne/index.html" class="breadcrumb-link">Home</a>
          <span class="breadcrumb-separator" aria-hidden="true">&gt;</span>
          <span class="breadcrumb-current" aria-current="page">Explore Courses</span>
        </nav>

        <!-- Main Page Title -->
        <h1 class="explore-hero-title">
          Find the right course for<br>
          your <span class="serif-italic">next step.</span>
        </h1>

        <!-- Pure HTML Search Input Bar -->
        <form class="search-bar-form" id="searchForm" role="search" method="GET" action="#exploreGrid">
          <div class="search-bar-wrapper">
            <svg class="search-leading-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="8"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
            </svg>
            <input type="search" id="courseSearchInput" name="q" class="search-input" placeholder="Search courses, skills, or topics..." autocomplete="off" aria-label="Search courses by keyword">
            <button type="submit" class="search-btn-circle" aria-label="Execute Search">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <circle cx="11" cy="11" r="8"></circle>
                <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
              </svg>
            </button>
          </div>
        </form>
      </div>
    </section>

    <!-- ================= MAIN EXPLORE CONTENT & FILTERS ================= -->
    <section class="explore-main-section" id="exploreGrid">
      <div class="explore-layout-container">
        <!-- Mobile Filter Bar (Visible on mobile/tablet) -->
        <div class="mobile-filter-bar">
          <label for="mobile-filter-toggle" class="mobile-filter-trigger" aria-label="Open filter sidebar">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <line x1="4" y1="21" x2="4" y2="14"></line>
              <line x1="4" y1="10" x2="4" y2="3"></line>
              <line x1="12" y1="21" x2="12" y2="12"></line>
              <line x1="12" y1="8" x2="12" y2="3"></line>
              <line x1="20" y1="21" x2="20" y2="16"></line>
              <line x1="20" y1="12" x2="20" y2="3"></line>
              <line x1="1" y1="14" x2="7" y2="14"></line>
              <line x1="9" y1="8" x2="15" y2="8"></line>
              <line x1="17" y1="16" x2="23" y2="16"></line>
            </svg>
            <span>Filters</span>
          </label>
        </div>

        <!-- Pure CSS Mobile Filter Backdrop -->
        <label for="mobile-filter-toggle" class="filter-backdrop" id="filterBackdrop"></label>
        
        <!-- ================= FILTER SIDEBAR (PURE HTML & CSS) ================= -->
        <aside class="filter-sidebar" id="filterSidebar" aria-label="Course Filters">
          <form method="GET" action="#exploreGrid">
            <div class="sidebar-header-row">
              <h3 class="filter-group-title" style="margin-bottom: 0;">Filters</h3>
              <label for="mobile-filter-toggle" class="sidebar-close-btn" aria-label="Close filters">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <line x1="18" y1="6" x2="6" y2="18"></line>
                  <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
              </label>
            </div>

            <!-- Group 1: Categories -->
            <div class="filter-group" id="categories">
              <h3 class="filter-group-title">Categories</h3>
              <ul class="filter-options-list">
                <li><label class="filter-checkbox-label"><input type="checkbox" name="category" value="web-development"><span>Web Development</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="category" value="graphic-design"><span>Graphic Design</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="category" value="data-science"><span>Data Science</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="category" value="computer-basics"><span>Computer Basics</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="category" value="video-editing"><span>Video Editing</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="category" value="beauty-lifestyle"><span>Beauty &amp; Lifestyle</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="category" value="digital-marketing"><span>Digital Marketing</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="category" value="music"><span>Music</span></label></li>
              </ul>
            </div>

            <hr class="filter-divider">
            <!-- Group 2: Level -->
            <div class="filter-group">
              <h3 class="filter-group-title">Level</h3>
              <ul class="filter-options-list">
                <li><label class="filter-checkbox-label"><input type="checkbox" name="level" value="beginner"><span>Beginner</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="level" value="intermediate"><span>Intermediate</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="level" value="advanced"><span>Advanced</span></label></li>
              </ul>
            </div>

            <hr class="filter-divider">
            <!-- Group 3: Price -->
            <div class="filter-group">
              <h3 class="filter-group-title">Price</h3>
              <ul class="filter-options-list">
                <li><label class="filter-checkbox-label"><input type="checkbox" name="price" value="free"><span>Free</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="price" value="paid"><span>Paid</span></label></li>
              </ul>
            </div>

            <hr class="filter-divider">
            <!-- Group 4: Rating -->
            <div class="filter-group">
              <h3 class="filter-group-title">Rating</h3>
              <ul class="filter-options-list">
                <li><label class="filter-checkbox-label"><input type="checkbox" name="rating" value="4.5"><span>4.5 &amp; up</span></label></li>
                <li><label class="filter-checkbox-label"><input type="checkbox" name="rating" value="4.0"><span>4.0 &amp; up</span></label></li>
              </ul>
            </div>
            <!-- Pure HTML Reset Button -->
            <button type="reset" class="clear-filters-btn" id="clearFiltersBtn">Clear All Filters</button>
          </form>
        </aside>

                <div class="explore-main-content">
          <!-- Top Row Header -->
          <div class="content-header-row">
            <div class="content-header-left">
              <h2 class="section-main-title">Explore all courses</h2>
              <p class="section-subtitle">Discover courses to help you learn, grow, and succeed.</p>
            </div>

            <!-- Desktop Sort Dropdown -->
            <div class="sort-container">
              <label for="desktopSortSelect" class="sort-label">Sort by:</label>
              <div class="sort-select-wrapper">
                <select id="desktopSortSelect" class="sort-select" aria-label="Sort courses">
                  <option value="popular">Most Popular</option>
                  <option value="rating">Highest Rated</option>
                  <option value="price-low">Price: Low to High</option>
                  <option value="price-high">Price: High to Low</option>
                </select>
                <svg class="sort-chevron-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <polyline points="6 9 12 15 18 9"></polyline>
                </svg>
              </div>
            </div>
          </div>

          <div class="courses-grid" id="coursesGrid" role="region" aria-label="Courses Catalog">
          </div>
        </div>
      </div>
    </section>
  </main>
</body>
</html>
